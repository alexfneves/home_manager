[*]
# Global server and runtime defaults
# jinja = true
# metrics = true
# fit = on
# load-mode = mlock
# threads = 12
# threads-batch = 12

jinja = true
metrics = true
slots = true
# 4-bit KV cache: the only precision where 4 slots x 262144 ctx fit in 123 GiB.
# cache-ram sits just above the token cap (262144 tokens x q4_0 = ~18.3 GiB),
# so the token cap binds, never cache-ram. iq4_nl costs the same if needed.
cache-ram = 20480
cache-type-k = q4_0
cache-type-v = q4_0

# CPU Threading
threads = 16
threads-batch = 32


 
# ==============================================================================
# Model 1: Thinking / Reasoning Mode
# Recommended for complex coding, mathematical logic, and multi-step tasks.
# ==============================================================================
[qwen3.8-27b-thinking]
model = /home/alexfneves/models/Qwen3.8-27B-UD-Q4_K_XL.gguf

# --- Context & Offloading ---
ctx-size = 262144
n-gpu-layers = 99
flash-attn = true

# --- Multi-Token Prediction (MTP Speculative Decoding) ---
spec-type = draft-mtp
spec-draft-n-max = 4

# --- Unsloth Guidelines: Thinking Mode Parameters ---
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

# --- Server / Engine Performance ---
parallel = 4
cont-batching = true


# ==============================================================================
# Model 2: Instruct / Non-Thinking Mode
# Recommended for fast edits, direct responses, and non-reasoning tasks.
# ==============================================================================
[qwen3.8-27b-instruct]
model = /home/alexfneves/models/Qwen3.8-27B-UD-Q4_K_XL.gguf

# --- Context & Offloading ---
ctx-size = 262144
n-gpu-layers = 99
flash-attn = true

# --- Multi-Token Prediction (MTP Speculative Decoding) ---
spec-type = draft-mtp
spec-draft-n-max = 4

# --- Unsloth Guidelines: Instruct Mode Parameters ---
temp = 0.7
top-p = 0.80
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0

# --- Server / Engine Performance ---
parallel = 4
cont-batching = true



[qwen3.8-27b-config-3]
# Model path & speculative decoding
model = /home/alexfneves/models/Qwen3.8-27B-UD-Q4_K_XL.gguf
spec-type = draft-mtp
spec-draft-n-max = 3

# VRAM & Offload settings
n-gpu-layers = auto
flash-attn = auto
kv-unified = true
cache-type-k = q4_0
cache-type-v = q4_0

# Context & Batching
ctx-size = 262144
n-predict = 32768
batch-size = 2048
ubatch-size = 512
parallel = 4

# Sampling parameters
temperature = 0.7
top-k = 20
top-p = 0.95
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 1.5




[qwen3.8-27b-config-4]
# Model Path (Update this to your GGUF path)
model = /home/alexfneves/models/Qwen3.8-27B-UD-Q4_K_XL.gguf

# Memory & Offload
gpu-layers = all
load-mode = mmap
fit = off

# Context & Batching
ctx-size = 262144
batch-size = 2048
ubatch-size = 512
parallel = 4

# KV Cache & Flash Attention
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0

# Speculative Decoding (MTP)
spec-type = draft-mtp
spec-draft-ngl = all
spec-draft-n-max = 4
spec-draft-p-min = 0.75

# Reasoning / Thinking Controls
reasoning-format = deepseek
reasoning-preserve = true




[qwen3.8-ridge]
model = /home/alexfneves/models/Qwen3.8-27B-Ridge-3.7bpw.gguf
# Optional vision support (uncomment if using the mmproj file):
# mmproj = "path/to/mmproj-Qwen3.8-27B-BF16.gguf"

# Context and Hardware configuration
ctx-size = 131072
n-gpu-layers = 99

# MTP (Multi-Token Prediction) Speculative Decoding
spec-type = draft-mtp
spec-draft-n-max = 3

# Sampling parameters recommended for Qwen3.8 (Thinking Mode)
temp = 0.3
top-p = 0.8
top-k = 20

