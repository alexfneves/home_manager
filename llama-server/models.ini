[*]
# Global server and runtime defaults
# jinja = true
# metrics = true
# fit = on
# load-mode = mlock
# threads = 12
# threads-batch = 12

jinja = true
metrics = true
slots = true
# 4-bit KV cache: the only precision where 4 slots x 262144 ctx fit in 123 GiB.
# cache-ram sits just above the token cap (262144 tokens x q4_0 = ~18.3 GiB),
# so the token cap binds, never cache-ram. iq4_nl costs the same if needed.
# cache-ram = 20480
# cache-type-k = q4_0
# cache-type-v = q4_0

# CPU Threading
# threads = 32
# threads-batch = 32


 
# ==============================================================================
# Model 1: Thinking / Reasoning Mode
# Recommended for complex coding, mathematical logic, and multi-step tasks.
# ==============================================================================
[qwen3.8-27b-thinking]
model = /home/alexfneves/models/Qwen3.8-27B-UD-Q4_K_XL.gguf

# --- Context & Offloading ---
ctx-size = 262144
n-gpu-layers = 99
flash-attn = true

# --- Multi-Token Prediction (MTP Speculative Decoding) ---
spec-type = draft-mtp
spec-draft-n-max = 4

# --- Unsloth Guidelines: Thinking Mode Parameters ---
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

# --- Server / Engine Performance ---
parallel = 4
cont-batching = true


# ==============================================================================
# Model 2: Instruct / Non-Thinking Mode
# Recommended for fast edits, direct responses, and non-reasoning tasks.
# ==============================================================================
[qwen3.8-27b-instruct]
model = /home/alexfneves/models/Qwen3.8-27B-UD-Q4_K_XL.gguf

# --- Context & Offloading ---
ctx-size = 262144
n-gpu-layers = 99
flash-attn = true

# --- Multi-Token Prediction (MTP Speculative Decoding) ---
spec-type = draft-mtp
spec-draft-n-max = 4

# --- Unsloth Guidelines: Instruct Mode Parameters ---
temp = 0.7
top-p = 0.80
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0

# --- Server / Engine Performance ---
parallel = 4
cont-batching = true



[qwen3.8-27b-config-3]
# Model path & speculative decoding
model = /home/alexfneves/models/Qwen3.8-27B-UD-Q4_K_XL.gguf
spec-type = draft-mtp
spec-draft-n-max = 3

# VRAM & Offload settings
n-gpu-layers = auto
flash-attn = auto
kv-unified = true
cache-type-k = q4_0
cache-type-v = q4_0

# Context & Batching
ctx-size = 262144
n-predict = 32768
batch-size = 2048
ubatch-size = 512
parallel = 4

# Sampling parameters
temperature = 0.7
top-k = 20
top-p = 0.95
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 1.5




[qwen3.8-27b-config-4]
# Model Path (Update this to your GGUF path)
model = /home/alexfneves/models/Qwen3.8-27B-UD-Q4_K_XL.gguf

# Memory & Offload
gpu-layers = all
# load-mode = mmap
fit = off

# Context & Batching
ctx-size = 262144
batch-size = 2048
ubatch-size = 512
parallel = 4

# KV Cache & Flash Attention
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0

# Speculative Decoding (MTP)
spec-type = draft-mtp
spec-draft-ngl = all
spec-draft-n-max = 4
spec-draft-p-min = 0.75

# Reasoning / Thinking Controls
reasoning-format = deepseek
# reasoning-preserve = true




[qwen3.8-ridge]
model = /home/alexfneves/models/Qwen3.8-27B-Ridge-3.7bpw.gguf
# Optional vision support (uncomment if using the mmproj file):
# mmproj = "path/to/mmproj-Qwen3.8-27B-BF16.gguf"

# Context and Hardware configuration
ctx-size = 131072
n-gpu-layers = 99

# MTP (Multi-Token Prediction) Speculative Decoding
spec-type = draft-mtp
spec-draft-n-max = 3

# Sampling parameters recommended for Qwen3.8 (Thinking Mode)
temp = 0.3
top-p = 0.8
top-k = 20


# ==============================================================================
# ROCmFP4 models (require the ROCmFPX fork built with llamaBackend = "rocm")
# ==============================================================================

# --------------------------------------------------------------------------
# Qwen3.8-27B ROCmFP4-STRIX + MTP draft head (kingjones777 model card).
# Card-tuned for max speed on Strix Halo: n-max 4 -> 30.30 tok/s @ 8K.
# NOTE: draft-n-max default of 16 halves throughput; keep it at 4.
# --------------------------------------------------------------------------
[qwen38-27b-rocmfp4-strix-mtp]
model = /home/alexfneves/models/qwen38-rocmfp4/Qwen3.8-27B-Q4_0_ROCMFP4_STRIX.gguf
model-draft = /home/alexfneves/models/qwen38-rocmfp4/mtp-Qwen3.8-27B-Q4_0.gguf

# GPU & loading
gpu-layers = all
device = ROCm0
fit = off
flash-attn = on
direct-io = true

# Speculative decoding (MTP)
spec-type = draft-mtp
spec-draft-ngl = all
spec-draft-device = ROCm0
spec-draft-n-max = 4
spec-draft-n-min = 0
spec-draft-p-min = 0.0

# Context (card-validated up to 65536; hybrid attention => cheap KV cache)
ctx-size = 262144
parallel = 1
cont-batching = true

# Vision projector (verified working with -fa on, uncomment to enable)
# mmproj = /home/alexfneves/models/qwen38-rocmfp4/mmproj-Qwen3.8-27B-BF16.gguf

# Sampling — Qwen thinking profile (thinking defaults ON at xhigh effort;
# bound it via chat-template-kwargs '{"reasoning_effort":"low"}' or disable
# with '{"enable_thinking":false}' from the client)
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0


# --------------------------------------------------------------------------
# Ornith-1.5-35B-A3B ROCmFP4 FAST_COHERENT (kingjones777 model card).
# Max speed = NO MTP drafter: card measured MTP as a net loss (0.89x).
# MoE with ~3B active params: ~62.7 tok/s decode on Strix Halo.
# Ships its own internal MTP head — do NOT pass a --model-draft here.
# --------------------------------------------------------------------------
[ornith-35b-a3b-rocmfp4-fast]
model = /home/alexfneves/models/ornith-35b-rocmfp4/Ornith-1.5-35B-A3B-Q4_0_ROCMFP4_FAST_COHERENT.gguf

# GPU & loading
gpu-layers = all
fit = off
flash-attn = on

# Context
ctx-size = 262144
parallel = 1
cont-batching = true

# Vision projector (uncomment to enable)
# mmproj = /home/alexfneves/models/ornith-35b-rocmfp4/mmproj-Ornith-1.5-35B-BF16.gguf

[Qwen3.8-Flash-Next-UD-IQ4_XS]
model = /home/alexfneves/models/Qwen3.8-Flash-Next-UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
ctx-size = 131072
batch-size = 4096
ubatch-size = 4096
n-gpu-layers = 999
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
flash-attn = on
chat-template-kwargs = {"enable_thinking":true,"reasoning_effort":"medium"}
gpu-layers = all
# device = ROCm0
parallel = 4
cont-batching = true

